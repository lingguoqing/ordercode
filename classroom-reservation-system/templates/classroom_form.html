{% extends 'base.html' %}
{% block title %}{{ 'Add Classroom' if action == 'add' else 'Edit Classroom' }}{% endblock %}
{% block content %}
<h1>{{ 'Add Classroom' if action == 'add' else 'Edit Classroom' }}</h1>
<form method="post" class="form">
  <label>Classroom Name<input name="name" required value="{{ room.name if room }}"></label>
  <label>Building<input name="building" required value="{{ room.building if room }}"></label>
  <label>Capacity<input type="number" min="1" name="capacity" required value="{{ room.capacity if room }}"></label>
  <label>Description<textarea name="description">{{ room.description if room }}</textarea></label>
  <label><input type="checkbox" name="is_featured" {% if room and room.is_featured %}checked{% endif %}> Featured</label>
  <div class="actions">
    <button class="btn" type="submit">Save</button>
    <a class="btn secondary" href="{{ url_for('admin_panel') }}">Cancel</a>
  </div>
</form>
{% endblock %}
