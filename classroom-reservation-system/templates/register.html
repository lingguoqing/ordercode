{% extends 'base.html' %}
{% block title %}注册{% endblock %}
{% block content %}
<h1>注册</h1>
<form method="post" class="form auth">
    <label>全名<input name="full_name" required></label>
    <label>电子邮件<input type="email" name="email" required></label>
    <label>密码<input type="password" name="password" required></label>
    <label>确认密码<input type="password" name="confirm" required></label>
    <button class="btn" type="submit">注册</button>
</form>
{% endblock %}
