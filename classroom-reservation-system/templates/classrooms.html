{% extends 'base.html' %}
{% block title %}Available Classrooms{% endblock %}
{% block content %}
<h1>Available Classrooms</h1>
<div class="room-list">
  {% for r in rooms %}
    <div class="room-item">
      <div class="room-info">
        <div class="room-name">{{ r.name }}</div>
        <div class="room-meta">Building: {{ r.building }} · Capacity: {{ r.capacity }}</div>
      </div>
      <div class="room-actions">
        <a class="btn small" href="{{ url_for('classroom_detail', room_id=r.id) }}">Book now</a>
      </div>
    </div>
  {% else %}
    <p>No classrooms.</p>
  {% endfor %}
  </div>
{% endblock %}
