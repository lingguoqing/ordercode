{% extends 'base.html' %}
{% block title %}Classroom Details{% endblock %}
{% block content %}
<h1>{{ room.name }}</h1>
<p>Building and location: {{ room.building }}{% if room.location %}, {{ room.location }}{% endif %}</p>
<p>Capacity: {{ room.capacity }}</p>
<div class="actions">
  <a class="btn" href="{{ url_for('book', room_id=room.id) }}">Book now</a>
  <a class="btn secondary" href="{{ url_for('classrooms') }}">Back to Classrooms</a>
  </div>
{% endblock %}
